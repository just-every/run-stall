# run-stall.com is not registered. The owner enables publication after the
# public-switch record and deployment prerequisites are complete.
name: Run site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run-site
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: run-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Deploy the static site
        run: pnpm exec rer deploy --site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Public readback
        run: |
          domain=$(node -p "require('./deploy-site.json').domain")
          for attempt in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/run")" = 200 ] && break
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/run")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/docs")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$domain/")" = "301 https://$domain/"
